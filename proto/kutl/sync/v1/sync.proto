syntax = "proto3";

package kutl.sync.v1;

// --- Relay policy ---

// What identity the relay treats as the principal.
enum AuthModel {
  AUTH_MODEL_UNSPECIFIED      = 0;
  AUTH_MODEL_ACCOUNT_REQUIRED = 2;  // an account session is required (kutlhub)

  // 1 = AUTH_MODEL_ANONYMOUS_DID: retired with the auth-less relay mode;
  // no relay advertises it, and an older relay's wire value 1 decodes to
  // UNSPECIFIED via the enum accessor's unwrap-or-default.
  reserved 1;
  reserved "AUTH_MODEL_ANONYMOUS_DID";
}

// How an invite is redeemed.
enum InviteModel {
  INVITE_MODEL_UNSPECIFIED      = 0;
  INVITE_MODEL_CAPABILITY_URL   = 1;  // anonymous bearer code -> space (OSS)
  INVITE_MODEL_MEMBERSHIP_GRANT = 2;  // authenticated redemption -> membership (kutlhub)
}

// The action a client must take before the requested operation can succeed.
enum NextStep {
  NEXT_STEP_UNSPECIFIED  = 0;
  NEXT_STEP_AUTHENTICATE = 2;
  NEXT_STEP_REGISTER     = 3;

  // 1 = NEXT_STEP_PROCEED: retired with the auth-less relay mode;
  // no relay emits it and no client ever read it.
  reserved 1;
  reserved "NEXT_STEP_PROCEED";
}

// Relay-advertised onboarding policy. Delivered pre-connect over the HTTP
// discovery route; the client follows it instead of inferring behavior from the
// relay URL or join-argument shape.
message RelayPolicy {
  AuthModel   auth_model     = 1;
  InviteModel invite_model   = 2;
  NextStep    next           = 3;
  string      auth_url       = 4;  // relay HTTP origin; the client derives the device-flow path from it, when next == AUTHENTICATE
  string      relay_endpoint = 5;  // ws URL to connect to (e.g. a proxy front door); empty => client uses {discovery_origin}/ws
}

// --- Top-level envelope ---

message SyncEnvelope {
  oneof payload {
    // Connection
    Handshake      handshake      = 1;
    HandshakeAck   handshake_ack  = 2;

    // Document sync
    Subscribe      subscribe      = 4;
    Unsubscribe    unsubscribe    = 5;
    SyncOps        sync_ops       = 6;
    PresenceUpdate presence_update = 8;
    StaleSubscriber stale_subscriber = 9;
    Signal signal = 10;

    // Document lifecycle (registry)
    RegisterDocument          register_document           = 11;
    RenameDocument            rename_document             = 12;
    UnregisterDocument        unregister_document         = 13;
    ListSpaceDocuments        list_space_documents        = 14;
    ListSpaceDocumentsResult  list_space_documents_result = 15;

    // Space ops
    JoinSpace          join_space          = 16;
    JoinSpaceResult    join_space_result   = 17;
    ResolveSpace       resolve_space       = 18;
    ResolveSpaceResult resolve_space_result = 19;

    // Read classification for a subscribe. Sent by the relay immediately
    // after Subscribe is processed; clients gate editor writability on
    // the LoadStatus. Older clients that don't handle this variant will
    // silently ignore it (proto unknown-field behavior) and proceed as
    // before.
    SubscribeStatus subscribe_status = 22;

    // Document lifecycle acks. Emitted by the relay after lifecycle-op
    // persistence commits across both `relay_registry` and the mirrored
    // `documents` row. The ack is the relay's promise of durable,
    // cross-store persistence; callers gate their reply to the original
    // RPC on it.
    RegisterDocumentAck   register_document_ack   = 23;
    RenameDocumentAck     rename_document_ack     = 24;
    UnregisterDocumentAck unregister_document_ack = 25;

    // Bulk lifecycle.
    // The UX server's DeleteSpace path soft-deletes every document in
    // a space; routing per-doc UnregisterDocument round-trips for N
    // docs is wasteful when the relay can enumerate its own registry.
    UnregisterSpace    unregister_space     = 26;
    UnregisterSpaceAck unregister_space_ack = 27;

    // Ownership transfer. Used by the ingestion accept-time re-attribution
    // path. account_id is intentionally immutable in save_entry's
    // COALESCE-on-conflict semantics (the creator is immutable); this
    // envelope is the explicit "transfer ownership of every doc in
    // the space" path that bypasses the immutability guard.
    TransferSpaceOwnership    transfer_space_ownership     = 28;
    TransferSpaceOwnershipAck transfer_space_ownership_ack = 29;

    // Authored signal doors. Arguments, not records: the
    // relay mints every identity field, so a client cannot assert one.
    SubmitFlag       submit_flag       = 30;
    SubmitComment    submit_comment    = 31;
    SubmitReply      submit_reply      = 32;
    SubmitTransition submit_transition = 33;

    // Signal stream. A new relay capability is a new FRAME, never a new
    // route — HTTP is for what happens before a session exists.
    SubscribeSignals  subscribe_signals   = 34;
    SignalPage        signal_page         = 35;
    SignalAck         signal_ack          = 36;
    SignalReseed      signal_reseed       = 37;
    StaleSignalStream stale_signal_stream = 38;

    // Ordering barrier. The relay answers a Barrier only after every frame
    // it received ahead of it on the same connection has been processed,
    // so a client that sent writes without awaiting their acks can learn
    // they were processed (and read any refusal the relay sent back) before
    // it closes the connection.
    Barrier    barrier     = 39;
    BarrierAck barrier_ack = 40;

    // The relay's refusal of a SyncOps frame, on the sender's own-ack lane.
    // Accepted ops are never acked; a refusal always is.
    SyncOpsRejected sync_ops_rejected = 41;
  }

  // 7 = change_notify (never produced by any released binary),
  // 20/21 = list_my_spaces / list_my_spaces_result (superseded by the MCP
  // list_spaces tool + owner/slug ResolveSpace before any client sent them).
  // Field numbers are shared with the oneof, so the pin sits at message level.
  // 3 = error: the bare refusal frame. Every refusal now rides the typed
  // reply of the request it answers (HandshakeAck, SubscribeStatus,
  // SyncOpsRejected, the space-op results, SignalAck, the lifecycle acks),
  // so a client always knows which request was refused.
  reserved 3, 7, 20, 21;
  reserved "error";
}

// --- Handshake ---

message Handshake {
  uint32 protocol_version_major = 1;
  uint32 protocol_version_minor = 2;
  string client_name            = 3;
  string auth_token             = 5;  // Bearer token from /auth/verify
  string display_name           = 6;  // Self-declared display name

  // 4 = features: every client sent it empty and the relay never read it
  // (the live capability gate is HandshakeAck.features, the other direction).
  reserved 4;
  reserved "features";
}

message HandshakeAck {
  uint32 protocol_version_major = 1;
  uint32 protocol_version_minor = 2;
  uint32 min_supported_major    = 3;
  string relay_name              = 4;
  repeated string features      = 5;
  string relay_did               = 7;  // relay signing identity (empty = no identity / graceful degrade)
  // Set when the relay refuses the handshake (a refused bearer, a client
  // below min_supported_major): the connection closes after this ack and
  // nothing else is sent. Absent on an accepted handshake.
  Error error = 8;

  // 6 = relay_policy: the only producer hardcoded it to unset — policy is
  // delivered via the HTTP discovery route (/relay-policy), never the ack.
  reserved 6;
  reserved "relay_policy";
}

// --- Subscriptions ---

// A document subscription: the document's SyncOps, presence and stale
// notices. It does not make the connection present in the space or enrol it
// in the space's lifecycle broadcasts; see SubscribeSignals.
message Subscribe {
  string space_id  = 1;
  string document_id = 2;
}

message Unsubscribe {
  string space_id  = 1;
  string document_id = 2;
}

// The relay's read classification for a subscribe cold-load.
// Sent once per subscribe, before any SyncOps catch-up (when present).
//
// `FOUND` means the backend returned bytes — safe to render normally.
// `EMPTY` means the document was never persisted (witness == 0) and the
//   editor may open writable — legitimate first-time document.
// `INCONSISTENT` means the witness recorded a prior successful flush at
//   `expected_version` but the backend now returns nothing — content was
//   lost between flush and this load. The client MUST refuse writes.
// `UNAVAILABLE` means at least one backend (or the witness) errored.
//   State is undetermined; client MUST refuse writes and surface a retry.
message SubscribeStatus {
  string space_id    = 1;
  string document_id = 2;
  LoadStatus load_status = 3;
  // Non-zero only for INCONSISTENT: the persisted_version the witness
  // claims is canonical but which the backend can no longer produce.
  uint64 expected_version = 4;
  // Non-empty only for UNAVAILABLE: human-readable reason for a banner.
  string reason = 5;
  // Set when the subscribe itself was refused (the connection is not
  // authorized for the space): no slot, no subscription, no catch-up, and
  // load_status is unspecified.
  Error error = 6;
}

enum LoadStatus {
  LOAD_STATUS_UNSPECIFIED  = 0;
  LOAD_STATUS_FOUND        = 1;
  LOAD_STATUS_EMPTY        = 2;
  LOAD_STATUS_INCONSISTENT = 3;
  LOAD_STATUS_UNAVAILABLE  = 4;
}

// --- Sync operations ---

message SyncOps {
  string space_id         = 1;
  string document_id      = 2;
  bytes ops               = 4;
  repeated ChangeMetadata metadata = 5;
  ContentMode content_mode = 8;
  bytes content_hash       = 9;
  int64 blob_size          = 10;
  string blob_ref_url      = 11;
  map<string, string> author_by_agent_snapshot = 12;  // uncapped agent→author_did snapshot for catch-up (blame durability)

  // 3 = parents, 6 = sequence_number, 7 = is_last: chunked-frame sequencing
  // was never implemented — every producer sent the defaults and no reader
  // ever looked.
  reserved 3, 6, 7;
  reserved "parents", "sequence_number", "is_last";
}

// Hybrid logical clock stamp, assigned at the origin client (daemon, UX
// server, ingestion worker, MCP). Orders lifecycle ops causally and
// reproducibly — the authoritative order for the lifecycle lattice. The
// total order is lexicographic (physical_ms, logical, actor).
message Hlc {
  uint64 physical_ms = 1;  // near wall-clock, keeps stamps human-interpretable
  uint32 logical     = 2;  // disambiguates within one millisecond
  bytes  actor       = 3;  // 16-byte per-install device UUID (NOT the DID)
}

message ChangeMetadata {
  string author_did = 1;
  string intent     = 2;
  int64 timestamp   = 3;  // Unix millis
  bool full_rewrite = 4;  // true when content was fully replaced (bulk path)

  // Client-provided change snippet. When set, the relay passes it through
  // instead of computing its own. Allows clients to provide richer summaries.
  string change_snippet = 5;

  // Extended fields for full change model
  string id                = 6;  // UUID as string
  Boundary boundary        = 7;
  VersionSpan version_span = 8;

  // Origin HLC for lifecycle ordering. Absent on pre-HLC clients; the relay
  // then has only `timestamp` (physical_ms) to order by — wall-clock LWW, the
  // strictly-less-wrong fallback for an un-upgraded daemon.
  Hlc hlc = 9;

  RemoteTip author_tip = 10;
}

// Portable form of version_span.end: the single (agent, seq) tip this change
// advanced to, resolved at author time. Survives cross-replica merge, unlike
// version_span (which holds NON-portable per-replica local times). Single-
// element because every change is minted by one replica's serial local edit.
message RemoteTip {
  string agent = 1;
  uint64 seq   = 2;
}

enum Boundary {
  BOUNDARY_UNSPECIFIED = 0;
  BOUNDARY_EXPLICIT    = 1;
  BOUNDARY_AUTO        = 2;
}

enum ContentMode {
  CONTENT_MODE_UNSPECIFIED = 0;
  CONTENT_MODE_TEXT        = 1;
  CONTENT_MODE_BLOB        = 2;
  CONTENT_MODE_BLOB_REF    = 3;
}

message VersionSpan {
  repeated uint64 start = 1;
  repeated uint64 end   = 2;
}

// Wrapper for the sidecar file.
message ChangeList {
  repeated ChangeMetadata changes = 1;
  map<string, string> author_by_agent = 2;  // uncapped agent→author_did snapshot
}

// --- Presence ---

message PresenceUpdate {
  string space_id        = 1;
  string document_id     = 2;
  string participant_did = 3;
  uint32 cursor_pos      = 4;
  bytes custom_data      = 5;
}

// --- Errors ---

// The relay's refusal of a `SyncOps` frame, sent on the sender's own-ack
// lane. Accepted ops are never acked; a refusal always is, and it names the
// document so the sender acts on the fields, never on the message prose.
message SyncOpsRejected {
  string space_id    = 1;
  string document_id = 2;
  Error  error       = 3;
}

// The refusal record every typed reply carries. It names no space or
// document: the carrier (`SyncOpsRejected`, `SubscribeStatus`, the acks and
// results) scopes the refusal at its own top level, so a client reads the
// scope from the carrier's fields, never from `message` prose.
message Error {
  ErrorCode code = 1;
  string message = 2;
  string details = 3;
  reserved 4, 5;
  reserved "space_id", "document_id";
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  AUTH_FAILED            = 1;
  NOT_FOUND              = 2;
  QUOTA_EXCEEDED         = 5;
  INVALID_MESSAGE        = 6;

  // Client's protocol major is below the relay's min_supported_major. The
  // relay sends this and closes: the frames such a client depends on are
  // gone, so a connection would silently deliver nothing.
  VERSION_MISMATCH       = 4;

  // 3 = RATE_LIMITED: never produced by any relay path and never matched by
  // any client.
  reserved 3;
  reserved "RATE_LIMITED";
}

// --- Stale subscriber eviction ---

enum StaleReason {
  STALE_REASON_UNSPECIFIED = 0;
  CHANNEL_FULL             = 1;
  CHANNEL_CLOSED           = 2;

  // 3 = CLIENT_TOO_SLOW: the relay only ever emits CHANNEL_FULL /
  // CHANNEL_CLOSED; no producer or reader existed.
  reserved 3;
  reserved "CLIENT_TOO_SLOW";

  // The relay discarded its in-memory copy of the document because the
  // engine could no longer be trusted (a contained engine panic) and
  // reloads it from storage on the next subscribe. Re-subscribe to replay
  // the current state.
  DOCUMENT_RELOADED        = 4;
}

message StaleSubscriber {
  string space_id     = 1;
  string document_id  = 2;
  StaleReason reason  = 3;
  uint64 relay_drops  = 4;
  uint64 relay_ops_count = 5;
  int64 timestamp_ms  = 6;
}

// --- Signals ---

enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED = 0;
  SIGNAL_TYPE_FLAG        = 1;
  SIGNAL_TYPE_CHAT        = 2;  // planned, not yet built — see ChatPayload
  SIGNAL_TYPE_DECISION    = 3;
  SIGNAL_TYPE_REPLY       = 4;
  // 5 is intentionally unused rather than reserved: a comment is a FLAG
  // KIND (`FLAG_KIND_COMMENT`), not a signal type, and no record was ever
  // written carrying 5 here.
}

enum FlagKind {
  FLAG_KIND_UNSPECIFIED      = 0;
  FLAG_KIND_INFO             = 1;
  FLAG_KIND_COMPLETED        = 2;
  FLAG_KIND_REVIEW_REQUESTED = 3;
  FLAG_KIND_QUESTION         = 4;
  FLAG_KIND_BLOCKED          = 5;
  // Observation kind (vs. urgency/action kinds above), and the DEGENERATE kind:
  // it is what an import produces from a source system that has only one way to
  // discuss a highlighted passage. That is the reason it exists at all, which is
  // why it stays a flag kind rather than becoming its own signal type — the
  // semantics and shape are a flag's, minus a kind to choose.
  //
  // Range-anchored via inline markdown `[text]{.cmt #signal-uuid}` or
  // document-level (no inline marker). The wrapped passage rides in
  // `FlagPayload.anchor_text`.
  FLAG_KIND_COMMENT          = 6;
}

// SUPERSEDED by `Audience` for records, but retained: legacy records carry
// it, and the Connect/browser surface still speaks it. Four illegal states
// are representable here — `PARTICIPANT` without a target, `SPACE` with one,
// and six audiences with no filtering behind them — which is why the typed
// replacement exists.
enum AudienceType {
  AUDIENCE_TYPE_UNSPECIFIED    = 0;
  AUDIENCE_TYPE_PARTICIPANT    = 1;
  AUDIENCE_TYPE_SPACE          = 2;
  AUDIENCE_TYPE_HUMAN_OWNERS   = 3;
  AUDIENCE_TYPE_HUMAN_EDITORS  = 4;
  AUDIENCE_TYPE_HUMAN_VIEWERS  = 5;
  AUDIENCE_TYPE_AGENT_OWNERS   = 6;
  AUDIENCE_TYPE_AGENT_EDITORS  = 7;
  AUDIENCE_TYPE_AGENT_VIEWERS  = 8;
}

// Who a signal is delivered to.
//
// A DELIVERY FILTER, NOT AN ACCESS BOUNDARY. `SignalPage` does not filter, so
// every synced client holds every record in its spaces — records are
// edge-durable space data (clients re-seed a restarted relay from their own
// segments), and a client can always leave with all of its data. A
// participant-scoped signal's content therefore reaches every synced client's
// disk; the audience decides who is notified, not who could read it.
//
// Established at CREATED and inherited by every later record for that signal
// (close, reopen, note, reply), resolved through one accessor rather than
// defaulting to space-wide.
message Audience {
  // Everyone in the space.
  message Space {}
  // One participant, by DID. The DID is required: an empty one is the
  // "delivers to nobody" state the untyped enum made representable.
  message Participant {
    string did = 1;
  }
  oneof to {
    Space space             = 1;
    Participant participant = 2;
  }
  // Field 3 is INTENTIONALLY UNUSED AND NOT RESERVED — held for the `Role`
  // arm, which ships only together with role filtering. Accepting role-scoped
  // records before the filter exists would mean records accepted meaning
  // "space-wide" that silently change meaning later; role also lives on the
  // membership backend, which has no OSS implementation today.
}

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_RESOLVED    = 1;
  CLOSE_REASON_DECLINED    = 2;
  CLOSE_REASON_WITHDRAWN   = 3;
  // No authoring path yet — forward-declared; nothing mints it until the
  // decision-tree/supersession linkage exists.
  CLOSE_REASON_SUPERSEDED  = 4;
}

// Which lifecycle event a signal record carries. A signal's
// current state is a fold over its records in HLC order. Senders that
// predate records leave all record-envelope fields unset (no record_id)
// and never enter the fold; any record lacking an explicit event folds
// as CREATED.
enum SignalEventType {
  SIGNAL_EVENT_TYPE_UNSPECIFIED = 0;
  SIGNAL_EVENT_TYPE_CREATED     = 1;
  SIGNAL_EVENT_TYPE_CLOSED      = 2;
  SIGNAL_EVENT_TYPE_REOPENED    = 3;
  SIGNAL_EVENT_TYPE_TOMBSTONED  = 4;  // soft delete — deletion-ladder rung 1
  // The signal's content is now the carried per-kind payload.
  // A new immutable record, not a mutation: identity persists, history
  // accumulates, the projection reflects the latest by LWW — on a content
  // track independent of the lifecycle fold, so an edit never reopens.
  // Not authorable: minted by the relay's materializer when a marker's
  // content changes without its identity changing.
  SIGNAL_EVENT_TYPE_EDITED      = 5;
}

// Who produced the record's signature. Verification is advisory and
// three-tiered: signed by a space member (strongest), relay-attested (the
// middle tier), or merely asserted (unsigned).
enum SignatureRole {
  SIGNATURE_ROLE_UNSPECIFIED  = 0;
  SIGNATURE_ROLE_AUTHOR       = 1;  // the actor's own device/custodied key
  SIGNATURE_ROLE_MATERIALIZER = 2;  // relay signing a marker-derived record
  SIGNATURE_ROLE_AGENT        = 3;  // a delegated agent tool's own key
}

// Relay countersignature: "DID X, authenticated, observed at T" — the
// middle verification tier for records the author could not sign.
message RelayAttestation {
  string relay_did      = 1;
  int64  observed_at_ms = 2;  // Unix millis
  // Ed25519 over: the `kutl-attest-v1` domain separator, a u64-LE length
  // prefix on the record's canonical bytes, those bytes, then this
  // attestation encoded with this signature field cleared. relay_did and
  // observed_at_ms are thereby covered by the signature, not merely
  // asserted.
  bytes  signature      = 3;
}

message Signal {
  string id                    = 1;
  string space_id              = 2;
  optional string document_id  = 3;
  string author_did            = 4;
  int64 timestamp              = 5;  // Unix millis
  oneof payload {
    FlagPayload flag           = 10;
    ChatPayload chat           = 11;  // planned, not yet authored — see ChatPayload
    DecisionPayload decision   = 12;
    ReplyPayload reply         = 13;
    // Carried by CLOSED / REOPENED / TOMBSTONED records.
    TransitionPayload transition = 25;
    // 24 is intentionally unused rather than reserved: a comment is a
    // `FLAG_KIND_COMMENT` flag, so it needs no arm of its own, and no record
    // was ever written carrying 24 here.
  }

  // --- Record envelope, additive. Absent on legacy senders. ---
  // Canonical signing bytes = this message encoded with `signature` and
  // `attestation` cleared.
  string           record_id    = 14;  // UUIDv4 for THIS event record
  SignalEventType  event        = 15;  // UNSPECIFIED == CREATED (legacy)
  Hlc              hlc          = 16;  // stamped by the appending node
  string           actor_did    = 17;  // who performed THIS event (a closer
                                       // may differ from author_did)
  CloseReason      close_reason = 18;  // meaningful on CREATED (= born
                                       // closed) and CLOSED
  SignatureRole    sig_role     = 19;
  bytes            signature    = 20;  // Ed25519; empty = unsigned (tier 3)
  RelayAttestation attestation  = 21;  // optional relay countersignature
  // Which version of the canonical-signing scheme this record's signature and
  // attestation were produced under. Absent/0 means the
  // original scheme: whole canonical bytes, `kutl-signal-v1` /
  // `kutl-attest-v1` domains. A verifier that does not recognize the value
  // MUST report `Unverifiable` rather than invalid — conflating "cannot check"
  // with "forged" would make a routine schema bump look like fleet-wide
  // forgery. Bootstrapped, not retroactive: readers learn the field first, and
  // only a later release may emit a bumped value.
  uint32           canonical_version = 22;
  reserved 23;  // held for delegation_ref (agent delegation, not yet built)
}

message FlagPayload {
  FlagKind kind                = 1;
  string message               = 4;
  // The typed audience. PRECEDENCE: a reader uses this when
  // set and falls back to the deprecated pair below otherwise. A writer MUST
  // NOT set both — doing so is rejected at the authored seam.
  Audience audience            = 5;

  // The passage a `FLAG_KIND_COMMENT` wrapped, kept for posterity so an anchor
  // that later drifts or is deleted still shows what was commented on.
  //
  // Meaningful for the comment kind ONLY, which is the cost of keeping a comment
  // a flag kind rather than giving it its own payload: one optional field that
  // five other kinds never set. Accepted because the alternative — a whole
  // `SignalType` — put a second discriminator on every reader and a migration on
  // the projection, to carry exactly this one field.
  //
  // Absent for a document-level comment, and when the source system supplied
  // none (the ingestion worker does not). It lives on the RECORD, not only the
  // projection, so it survives a rebuild from segments.
  optional string anchor_text  = 6;

  // Fields 2 and 3 are DEPRECATED BUT NEVER RESERVED, and the distinction is
  // load-bearing. Canonical signing bytes are produced by re-encoding the
  // DECODED record, segments re-decode with prost, and prost keeps no unknown
  // fields — so reserving a number here would strip the field from every
  // record already on disk, changing its canonical bytes and invalidating its
  // signature. That estate is real: segments on OSS relays and on every synced
  // client. Deprecating costs nothing; reserving is a data-loss event.
  AudienceType audience_type   = 2 [deprecated = true];
  optional string target_did   = 3 [deprecated = true];
}

// The note carried by a lifecycle transition — "why this was closed".
// Sourced from the record rather than an observer side-channel, so it
// survives a rebuild from the log.
message TransitionPayload {
  string note = 1;
}

// --- Authored signal frames -----------------------------------------------
//
// The authored door carries ARGUMENTS, not records. Four frames mirror the
// four per-kind builders 1:1, so the illegal states are unrepresentable rather
// than rejected at runtime — the same standard applied to `FlagPayload`.
//
// What a client CANNOT reach from here is the point: `record_id`, `hlc`,
// `author_did`, `actor_did`, `sig_role`, `signature` and `attestation` are
// structurally absent, so the relay mints them and a client cannot assert
// them. `TOMBSTONED` has no wire representation on this path either — it stays
// system-minted by the delete cascades, which makes event legality a property
// of the frame set rather than a runtime gate.
//
// The authored door deliberately does not accept a client-built `Signal`:
// every client would then construct its own record and the shared path would
// begin at minting rather than at validation — exactly the divergence these
// frames exist to remove.
//
// `client_ref` is TRANSPORT-ONLY — it correlates a submit with its SignalAck
// and never appears on a Signal. It is the only correlation key a submit has,
// so a rejection rides the SignalAck that carries it back; nothing else on
// the connection could name which submit was refused.

// Authored door — flags. `signal_id` is optional and honoured when supplied:
// the comment flow needs it, because the inline `[text]{.cmt #uuid}` marker
// must name the same UUID as the signal.
message SubmitFlag {
  string client_ref            = 1;
  string space_id              = 2;
  optional string document_id  = 3;
  FlagKind kind                = 4;
  string message               = 5;
  Audience audience            = 6;
  optional string signal_id    = 7;
}

// Authored door — comments. Separate from SubmitFlag despite emitting a flag
// payload, because a comment is the only kind carrying an anchor and because
// authoring one should be a deliberate call rather than something a caller
// falls into by passing `kind: comment`. `anchor_text` is optional: a
// document-level comment has no anchored passage, and an importer may have
// none to give.
message SubmitComment {
  string client_ref            = 1;
  string space_id              = 2;
  string document_id           = 3;
  string signal_id             = 4;
  string message               = 5;
  optional string anchor_text  = 6;
  Audience audience            = 7;
}

// Authored door — replies. A reply carries no audience: it inherits its
// parent's, transitively.
message SubmitReply {
  string client_ref                 = 1;
  string space_id                   = 2;
  string parent_signal_id           = 3;
  optional string parent_reply_id   = 4;
  string body                       = 5;
}

// Authored door — close / reopen. `event` accepts CLOSED and REOPENED only;
// TOMBSTONED is not authorable (see the block comment above). The note rides
// the transition record, so it survives a rebuild from segments
// instead of living only on a transient observer event.
message SubmitTransition {
  string client_ref            = 1;
  string space_id              = 2;
  string signal_id             = 3;
  SignalEventType event        = 4;
  optional CloseReason close_reason = 5;
  optional string note         = 6;
}

// --- Signal stream frames -------------------------------------------------

// Listen to a space. A successful subscribe puts the connection in the
// space's listener set for the life of the connection: the recipient set for
// the space's signals AND its lifecycle broadcasts (RegisterDocument /
// RenameDocument / UnregisterDocument), and what makes the connection
// present in the space (list_participants, status). Every party sends it
// first thing: the daemon on session start, `kutl mcp serve` on connect. A
// document Subscribe is not a substitute. A refused subscribe (answered
// with StaleSignalStream) enrols nothing.
//
// `cursor` resumes the backlog from a prior page; absent means from the
// beginning. The cursor is a COARSE physical-ms floor: one relay mints all
// HLCs, so a high-water boundary is correct, and the fold's idempotence
// absorbs any same-millisecond over-fetch. Re-sending with a cursor keeps
// the same listener entry.
message SubscribeSignals {
  string space_id  = 1;
  optional Hlc cursor = 2;
}

// Bulk backfill, paged. A page is `max` records PLUS the trailing group that
// shares its `physical_ms`, so a resume filter of `physical_ms > cursor` can
// never split a millisecond and lose the remainder.
message SignalPage {
  repeated Signal records = 1;
  Hlc cursor              = 2;
  bool more               = 3;
}

// Per-submit result, on the ack lane. MANDATORY: `client_ref` is the only
// key that correlates a result with its submit, so a rejection has to ride
// this frame to name the submit it refuses. It is also what lets a submitter
// surface failure at all — without an ack, a dropped submit is invisible to
// its sender.
//
// `success: true` is emitted only AFTER the projection write commits, so ack
// implies readable through the existing read path. Clients invalidate caches
// on ack, never on send.
//
// A refusal carries the same typed `Error` as every other refusal reply:
// `code` is what a client branches on (AUTH_FAILED vs INVALID_MESSAGE vs
// NOT_FOUND), `message` is display text. Set exactly when `success` is false.
message SignalAck {
  string client_ref        = 1;
  string signal_id         = 2;
  string record_id         = 3;
  bool success             = 4;
  Error error              = 6;

  // 5 = error as a bare string message: the typed `Error` on 6 supersedes
  // it under the same name, so only the number is pinned.
  reserved 5;
}

// Ordering barrier: no side effects, answered in connection order on the
// connection's own-ack lane. A client sends one after writes it did not
// await (content ops, blob bytes, signals) and reads until the matching
// BarrierAck; every direct reply to those writes on that lane (a lifecycle
// ack, a SyncOpsRejected, a SignalAck) arrives before the ack. Broadcasts on the data
// and control lanes are not ordered against it. Sending the WebSocket close
// frame first instead would race those replies: a peer's close frame ends
// the relay's ability to write, so replies still queued behind it are lost.
// Answered only after the handshake; a client checks the "barrier" feature
// in the HandshakeAck before relying on it.
message Barrier {
  string client_ref = 1;
}

message BarrierAck {
  string client_ref = 1;
}

// Replication. Carries whole records, unlike the authored frames,
// because replication legitimately moves records while authoring does not.
message SignalReseed {
  repeated Signal records = 1;
  // `space_id` scopes the authorization check (sender membership) and
  // `client_ref` correlates the `SignalAck`; a reseed without them could be
  // neither authorized nor answered.
  string space_id   = 2;
  string client_ref = 3;
}

// Why a signal stream is not going to deliver. `cause` is what a client
// branches on; the prose `reason` beside it is for the log line.
enum StaleStreamReason {
  STALE_STREAM_REASON_UNSPECIFIED = 0;

  // A live signal frame found the connection's data lane full. The
  // connection stays a listener, present and receiving lifecycle
  // broadcasts; only signal delivery waits. Re-subscribe at once: the
  // backlog page answers on the own-ack lane, so a re-subscribe cannot
  // earn another pause.
  STALE_STREAM_REASON_PAUSED_LANE_FULL = 1;

  // The subscribe was refused: the connection is not authorized for the
  // space and is not a listener there. Deterministic for the life of the
  // authorization, so a client stops re-subscribing and surfaces the
  // refusal; the next session tries afresh.
  STALE_STREAM_REASON_NOT_AUTHORIZED = 2;

  // The connection is a listener, but the relay could not load the space's
  // records to build the backlog page. Re-subscribe with backoff.
  STALE_STREAM_REASON_RECORDS_UNAVAILABLE = 3;
}

// The answer to a `SubscribeSignals` the relay could not serve with a
// `SignalPage`, and the notice that a flowing stream has paused: see
// `StaleStreamReason` for what each cause asks of the client. Rides the ACK
// lane, not the lane that overflowed — a notice sent down a congested lane
// re-strands the listeners it exists to save.
message StaleSignalStream {
  string space_id          = 1;
  string reason            = 2;
  StaleStreamReason cause  = 3;
}

// Chat is a PLANNED signal kind, intentionally not yet implemented: this
// payload + its `SignalType`/oneof entries are the placeholder for it. Do NOT
// treat as dead code or remove in a hygiene sweep — the absence of an
// authoring path is by design.
message ChatPayload {
  optional string topic        = 1;
  optional string target_did   = 2;
}

message DecisionPayload {
  string title_hash            = 1;
  string title                 = 2;
  int32 depth                  = 4;
  optional string parent_hash  = 5;

  // 3 = state, a deleted {OPEN, RESOLVED} enum: resolved-ness derives from
  // the signal's own lifecycle status — a resolved decision is
  // Closed(close_reason=RESOLVED) — so a per-kind state field on the wire
  // was a redundant second authority. An older sender's wire value 3 decodes
  // as an unknown field and is ignored.
  reserved 3;
  reserved "state";
}

message ReplyPayload {
  string parent_signal_id          = 1;
  optional string parent_reply_id  = 2;
  string body                      = 3;
}

// HTTP catch-up response / push body. The request side is plain GET query
// params (`since` = coarse physical-ms floor, `max` = page size); there is no
// protobuf request message.
message SignalCatchUpResult {
  string space_id         = 1;
  repeated Signal records = 2;
  Hlc    high_water       = 3;  // sender's high-water mark after this page
  bool   more             = 4;  // page again from high_water
}

// --- Document lifecycle ---
// Relay-maintained registry operations. Processed by the relay, persisted to
// the document registry, and broadcast to the space's listeners (the
// connections that subscribed to its signals; see SubscribeSignals).

message RegisterDocument {
  string space_id = 1;
  string document_id = 2;
  string path = 3;
  ChangeMetadata metadata = 4;
  // Filesystem birthtime (Unix millis). Set by the daemon from
  // `stat`'s creation-time field when the platform/filesystem exposes
  // it. Absent when unsupported or for non-FS registers; the relay
  // leaves `documents.originally_created_at` NULL in that case. Older
  // daemons that don't set this field stay wire-compatible (proto3
  // optional, omitted on the wire = absent on read).
  optional int64 originally_created_at_ms = 5;
  // Source provenance for ingested documents. Populated by the
  // ingestion worker and mirrored to the `documents` table columns of
  // the same names. Daemon writers leave these absent — the DB default
  // for `source_kind` is 0 (native) and the other four columns are
  // NULL. Provenance is write-once: the relay's persistence layer does
  // not overwrite these on re-register (path/title get updated,
  // provenance does not).
  optional uint32 source_kind = 6;
  optional string source_id = 7;
  optional string source_url = 8;
  optional string ingestion_job_id = 9;
  optional string source_author_display = 10;
  // UX-only metadata mirrored to the documents.title column; relay does
  // not store this on RegistryEntry. Threaded through to the mirror
  // INSERT in the kutlhub-relay's PG backend. Daemon writers leave this
  // absent.
  optional string title = 11;
  // UX-only metadata mirrored to the documents.content_type column;
  // relay does not store this on RegistryEntry. Same threading as
  // `title` above.
  optional string content_type = 12;
  // UX-only metadata mirrored to documents.converted_from_id; relay
  // does not store this on RegistryEntry. Populated by the
  // document-conversion paths (PDF/plain-text upload conversion and
  // the ingestion worker's docx convert) so the converted markdown row
  // carries a pointer back at the source upload. Write-once on insert,
  // re-bound on re-register via COALESCE so a later envelope without
  // provenance doesn't clobber an earlier write that had it.
  optional string converted_from_id = 13;
  // UX-only metadata mirrored to documents.converted_from_filename;
  // same threading and COALESCE rule as `converted_from_id`.
  optional string converted_from_filename = 14;
  // UX-only metadata mirrored to documents.size_bytes; same threading
  // and COALESCE rule. Carries the byte size of the original upload
  // for tier-quota accounting. The relay's quota backend computes its
  // own per-edit deltas; this field is the at-register initial value,
  // and subsequent edits update it via the quota path.
  optional int64 size_bytes = 15;
}

message RenameDocument {
  string space_id = 1;
  string document_id = 2;
  string old_path = 3;
  string new_path = 4;
  ChangeMetadata metadata = 5;

  // Causal floor: the `registered_hlc` the renamer had recorded for this doc
  // when it issued the rename. A remote REGISTER is folded watermark-only (never
  // `recv`'d, to avoid leaking the registrant's clock skew), so a rename of a
  // skewed registrant's doc can carry a `renamed_hlc` below the future
  // `registered_hlc`. This floor lets the lattice recognize the rename as
  // causally-after the register it observed (the renamer could not rename a doc
  // it never saw registered), so the rename supersedes the register's path even
  // when its own HLC falls below the skewed registration. Absent on senders
  // that predate this field. See `DocRecord::path_priority`.
  Hlc rename_causal_floor = 6;
}

message UnregisterDocument {
  string space_id = 1;
  string document_id = 2;
  ChangeMetadata metadata = 3;
}

// --- Document lifecycle acks ---
//
// Each lifecycle op (RegisterDocument / RenameDocument / UnregisterDocument)
// is acknowledged by the relay AFTER persistence commits across both the
// registry store (`relay_registry`) and the mirrored `documents` row in
// the kutlhub-relay's PG backend. The ack is the relay's promise of
// durable, cross-store persistence; the UX server's Connect handler
// awaits the matching ack before returning to the HTTP caller. The
// content-seeding path gates on a drain-barrier round-trip instead, not
// these acks.
//
// Success/failure encoding: `success = true` ⇒ persistence confirmed;
// for RegisterDocumentAck the `entry` field carries the persisted
// `RegistryEntry`. `success = false` ⇒ `error` populated with the
// structured failure (path collision, unauthorized, persistence error).

// Snapshot of a single registry entry, returned by RegisterDocumentAck
// when persistence succeeds. Mirrors the relay's in-memory
// `RegistryEntry` struct. UX-only fields
// (`title`, `content_type`) are NOT carried here — they live only on
// the mirrored `documents` row, not on the registry.
message RegistryEntry {
  string document_id                   = 1;
  string path                          = 2;
  string created_by                    = 3;
  int64 created_at                     = 4;  // Unix millis
  optional string renamed_by           = 5;
  optional int64 renamed_at            = 6;  // Unix millis
  optional int64 deleted_at            = 7;  // Unix millis
  optional string account_id           = 8;
  optional int64 edited_at             = 9;  // Unix millis
  optional int64 originally_created_at = 10; // Unix millis
  optional uint32 source_kind          = 11;
  optional string source_id            = 12;
  optional string source_url           = 13;
  optional string ingestion_job_id     = 14;
  optional string source_author_display = 15;
}

// Ack for RegisterDocument. Persistence-confirmed across both
// `relay_registry` and the mirrored `documents` row. On success, `entry`
// carries the persisted snapshot. On failure, `error` carries the
// structured failure and `entry` is unset.
message RegisterDocumentAck {
  // Correlation key: exact match against the (space_id, document_id)
  // pair the caller put in the RegisterDocument envelope.
  string space_id    = 1;
  string document_id = 2;
  // Persisted state, populated when success = true.
  RegistryEntry entry = 3;
  // Structured error, populated when success = false: the same refusal
  // record every typed reply carries.
  Error error = 4;
  bool success = 5;
  // Liveness HLC of the persisted document (max of registered/renamed/touched),
  // for the daemon's freshness gate on the ack's self-correction to an
  // arbitrated conflict path. Populated when success = true.
  Hlc hlc = 6;
}

// Ack for RenameDocument. Persistence-confirmed across both
// `relay_registry` and the mirrored `documents` row. On success, `entry`
// carries the persisted snapshot — whose `path` is the POST-arbitration
// effective path, which differs from the requested path when the rename
// lost a path collision and was conflict-copied. The renamer reconciles
// its own local file to `entry.path`.
message RenameDocumentAck {
  string space_id    = 1;
  string document_id = 2;
  // Structured error, populated when success = false.
  Error error    = 3;
  bool success   = 4;
  // Persisted state, populated when success = true.
  RegistryEntry entry = 5;
  // Liveness HLC of the persisted document, for the daemon's freshness gate on
  // the ack's self-correction. Populated when success = true.
  Hlc hlc = 6;
}

// Ack for UnregisterDocument. Persistence-confirmed across both
// `relay_registry` (soft-delete recorded) and the mirrored `documents`
// row (deleted_at set).
message UnregisterDocumentAck {
  string space_id    = 1;
  string document_id = 2;
  // Structured error, populated when success = false.
  Error error    = 3;
  bool success   = 4;
}

// --- Bulk lifecycle ---

// Soft-delete every document in a space. Used by the UX server's
// DeleteSpace handler (which also marks the space itself deleted in
// its `spaces` row, a UX-server-owned concern outside the relay).
//
// The relay enumerates its in-memory registry for the space, runs the
// unregister code path for each active doc, and includes the IDs in
// the ack so the caller can correlate. Atomicity is per-doc, not
// across the bulk operation: a partial failure mid-enumeration is
// possible and the ack reports which doc was being processed.
message UnregisterSpace {
  string space_id = 1;
  ChangeMetadata metadata = 2;
}

message UnregisterSpaceAck {
  string space_id = 1;
  // IDs of documents the relay successfully soft-deleted in this
  // call. Empty when `success = false` (or when the space had no
  // active docs).
  repeated string document_ids = 2;
  Error error = 3;
  bool success = 4;
}

// Transfer ownership of every document in a space to a new account.
// Used by the ingestion-worker's accept-time re-attribution path
// (`AcceptIngestion` in the UX server). Re-attributes `created_by` /
// `updated_by` on every document in the space.
//
// This is a NARROW deviation from RegistryEntry.account_id's normal
// immutability — `save_entry`'s ON CONFLICT clause deliberately does
// not COALESCE `account_id` because the creator-is-immutable contract
// is correct for normal re-registers (the daemon round-trips the
// same DID, conversion preserves authorship, etc.). The accept-time
// re-attribution is the only place where an entire space's
// `account_id` should flip, and giving it its own envelope keeps the
// guardrail honest.
//
// `new_account_id` is the destination account UUID (caller resolves
// the user from session before sending). The envelope flips
// `relay_registry.account_id` AND mirrors to
// `documents_table.created_by` / `updated_by`.
//
// DESTRUCTIVE — rewrites attribution on soft-deleted rows too. Both
// the registry UPDATE and the mirror UPDATE are unfiltered by
// `deleted_at`, so a row that was soft-deleted under the previous
// owner has its `created_by` / `updated_by` flipped to the new owner.
// For the only current caller
// (ingestion accept of a freshly-imported staging space whose rows
// have no tombstone history) this is unobservable, but a future caller
// running this against a long-lived space would rewrite attribution
// history. Only safe for fresh-imported staging spaces; if you have a
// different use case, prefer adding a `WHERE deleted_at IS NULL`
// gate at the relay + backend level rather than reusing this envelope.
//
// Also DOES NOT broadcast — subscribers to the space won't learn that
// `created_by` flipped without re-fetching. This is intentional: the
// only caller (ingestion accept) tears down the staging space
// immediately after transfer, so existing subscribers are about to
// lose their subscription regardless. If a future caller needs
// broadcast, add a per-doc lifecycle event emission to the handler's
// loop in `relay/lifecycle.rs::handle_transfer_space_ownership`.
message TransferSpaceOwnership {
  string space_id = 1;
  string new_account_id = 2;
  ChangeMetadata metadata = 3;
}

message TransferSpaceOwnershipAck {
  string space_id = 1;
  // Number of registry entries successfully transferred (active +
  // soft-deleted; both are touched to keep mirror columns honest).
  uint32 transferred_count = 2;
  Error error = 3;
  bool success = 4;
}

// Lists the space's active documents. A pure query: it enrols the
// connection in nothing. Lifecycle broadcasts go to the space's listeners;
// see SubscribeSignals.
message ListSpaceDocuments {
  string space_id = 1;
}

message ListSpaceDocumentsResult {
  string space_id = 1;
  repeated DocumentInfo documents = 2;
  // Set when the request was refused; documents is then empty.
  Error error = 3;
}

message DocumentInfo {
  string document_id = 1;
  string path = 2;
}

// --- Space ops ---

message JoinSpace {
  string code = 1;
}

message JoinSpaceResult {
  string space_id = 1;
  string space_name = 2;
  string space_slug = 3;
  string owner_account_id = 4;
  // Set when the redemption was refused; the other fields are then empty.
  Error error = 5;
}

message ResolveSpace {
  string owner = 1;
  string slug = 2;
}

message ResolveSpaceResult {
  string space_id = 1;
  string space_name = 2;
  string relay_url = 3;
  // Set when the resolve was refused; the other fields are then empty.
  Error error = 4;
}
